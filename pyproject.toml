[project]
name = "video-pipeline"
version = "0.1.0"
description = "High-performance multilingual video automation pipeline using ROCM and GPT-SoVITS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "taskiq>=0.11.0",
    # "taskiq-sqlite>=0.1.0", # Removed: package not found
    "watchdog>=4.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0,<2.0.0",
    "streamlit>=1.30.0",
    "google-generativeai>=0.3.0",
    "psutil>=5.9.0",
    "jieba>=0.42.1",
    "scipy>=1.10.0",
    "librosa>=0.10.2",
    "numba>=0.57.0",
    "pytorch-lightning>=2.4.0",
    "gradio<5.0.0",
    "ffmpeg-python>=0.2.0",
    "onnxruntime>=1.16.0",
    "tqdm>=4.66.0",
    "funasr>=1.0.27",
    "cn2an>=0.5.22",
    "pypinyin>=0.50.0",
    "pyopenjtalk>=0.3.0",
    "g2p_en>=2.1.0",
    "modelscope>=1.11.0",
    "sentencepiece>=0.1.99",
    "transformers>=4.43,<4.51",
    "peft>=0.11.0,<0.18.0",
    "chardet>=5.2.0",
    "jieba_fast>=0.53",
    "fast_langdetect>=0.3.1",
    "wordsegment>=1.3.1",
    "rotary_embedding_torch>=0.5.3",
    "ToJyutping>=0.0.1",
    "g2pk2>=0.0.3",
    "ko_pron>=1.0.0",
    "opencc>=1.1.7",
    "python_mecab_ko>=1.3.0",
    "fastapi>=0.115.2",
    "x_transformers>=1.0.0",
    "torchmetrics<=1.5",
    "ctranslate2>=4.0.0,<5.0.0",
    "av>=11.0.0",
    "split-lang>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
